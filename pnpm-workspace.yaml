packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Dependencies allowed (true) or refused (false) to run install scripts.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  ssh2: true
  cpu-features: false
  unrs-resolver: true

# Patched versions of transitive dependencies flagged by `pnpm audit`
# (both come from the Prisma CLI; mysql2 is unused with Postgres).
overrides:
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'

# Local development services. Host ports are non-default to avoid clashing
# with other projects. See docs/10-local-development.md.
name: selfship-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: selfship
      POSTGRES_PASSWORD: selfship
      POSTGRES_DB: selfship
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U selfship']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1026:1025' # SMTP
      - '8026:8025' # Web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:

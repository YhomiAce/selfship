# Selfship from prebuilt images (ghcr.io), used by our own environments
# (dev.selfship.dev) and by self-hosters who don't want to build from source.
#
#   SELFSHIP_TAG=<commit sha> docker compose -f compose.yml --env-file .env up -d
#
# Same services as ../docker-compose.yml (which builds from source); keep the
# two in sync. On our servers, /usr/local/bin/selfship-deploy drives this file.

name: selfship

x-image: &image-defaults
  pull_policy: missing
  logging:
    driver: local
    options: { max-size: 10m, max-file: '3' }

x-app: &app
  <<: *image-defaults
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://selfship:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/selfship
    REDIS_URL: redis://redis:6379
    WEB_URL: https://${SELFSHIP_DOMAIN:?set SELFSHIP_DOMAIN}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    <<: *image-defaults
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: selfship
      POSTGRES_DB: selfship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U selfship -d selfship']
      interval: 5s
      retries: 20

  redis:
    <<: *image-defaults
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file: queued jobs survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  migrate:
    <<: *image-defaults
    image: ${SELFSHIP_IMAGE_PREFIX:-ghcr.io/yhomiace/selfship}-migrate:${SELFSHIP_TAG:?set SELFSHIP_TAG}
    environment:
      DATABASE_URL: postgresql://selfship:${POSTGRES_PASSWORD}@postgres:5432/selfship
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app
    image: ${SELFSHIP_IMAGE_PREFIX:-ghcr.io/yhomiace/selfship}-api:${SELFSHIP_TAG:?set SELFSHIP_TAG}

  worker:
    <<: *app
    image: ${SELFSHIP_IMAGE_PREFIX:-ghcr.io/yhomiace/selfship}-worker:${SELFSHIP_TAG:?set SELFSHIP_TAG}

  web:
    <<: *app
    image: ${SELFSHIP_IMAGE_PREFIX:-ghcr.io/yhomiace/selfship}-web:${SELFSHIP_TAG:?set SELFSHIP_TAG}
    depends_on:
      api:
        condition: service_healthy

  # HTTPS in front of the web app (certificates from Let's Encrypt, automatic).
  caddy:
    <<: *image-defaults
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SELFSHIP_DOMAIN: ${SELFSHIP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  caddy-data:

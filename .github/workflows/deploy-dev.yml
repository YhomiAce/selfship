name: Deploy dev

# Every push to main (including merged pull requests) is checked, built into
# images on ghcr.io and deployed to the dev environment (dev.selfship.dev).
# A future prod environment gets its own workflow on a `prod` branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits instead of cancelling a deploy.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io names must be lowercase: ghcr.io/<owner>/selfship-<target>.
      - name: Image prefix
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # One job, four targets: they share the expensive build stage, which the
      # first build caches for the other three (and in GitHub's cache for the next run).
      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.PREFIX }}-api:${{ github.sha }},${{ env.PREFIX }}-api:dev
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=selfship
          cache-to: type=gha,scope=selfship,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.PREFIX }}-worker:${{ github.sha }},${{ env.PREFIX }}-worker:dev
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=selfship

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.PREFIX }}-web:${{ github.sha }},${{ env.PREFIX }}-web:dev
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=selfship

      - name: Build and push migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.PREFIX }}-migrate:${{ github.sha }},${{ env.PREFIX }}-migrate:dev
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=selfship

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    steps:
      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The deploy key can only run selfship-deploy (deploy/server/selfship-deploy):
      # it pulls this commit's images and config, waits for health, and rolls
      # back to the previous commit if the new one is unhealthy.
      - name: Deploy ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o CheckHostIP=no -o ServerAliveInterval=30 \
            "deploy@${{ vars.DEPLOY_HOST }}" deploy "${{ github.sha }}"

      - name: Check the dashboard answers
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/api/health" || true)
            echo "attempt $i: $code"
            [ "$code" = 200 ] && exit 0
            sleep 6
          done
          exit 1
